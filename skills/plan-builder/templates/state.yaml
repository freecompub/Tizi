#      - { date: "", what: "", source: "" }
#    outcome: a_mesurer    # a_mesurer | atteint | partiel | non_atteint
#    learnings: []         # chacun devient une story ou une opportunité

hypotheses: []
risks: []                  # - { id: R-01, text: "", likelihood: "", impact: "", response: "", status: proposé }
shadow_zones: []
#  - { id: ZO-001, type: question_story, question: "", story: US-001, ask_to: "", blocking: true, status: ouverte, resolution: "" }
questions: []
council_runs: []

plan_sections:
  stories: à rédiger
  readiness: à rédiger
  tasks: à rédiger
  schedule: à rédiger

coverage_thresholds: {}     # seuils de couverture en %, par métrique ; vide = valeurs par défaut (lib/rules.mjs, COVERAGE_DEFAULTS)
coverage_waivers: []        # - { metric: fr_ac, reason: "", approved_by: "" }   # seuil non atteint, assumé et approuvé

governance:
  version: "0.1"
  status: brouillon        # brouillon | en_revue | approuvé | baseline
  reviewers: []            # - { who: "", role: approbateur }
  review_rounds: []
  comments: []
  approvals: []
  baselines: []
  change_requests: []      # CR-xxx ; target: plan | prd | sad | brd
  backlog_approvals: []    # approbations de plans d'opérations, lues par backlog-executor
#    - { target: github, sha256: "", autonomy: partiel, reviewed: [], ops: [], declared_by: "", date: "" }   # autonomy : complet | partiel | manuel

session:                   # continuité entre sessions (references/sessions.md)
  next_action: ""          # prochaine action notée avant une pause
