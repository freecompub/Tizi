# État de la vérification d'une release — source de vérité de l'étape 6.
document: test
initiative: { name: "", slug: "" }
source_plan:
  path: ""                 # plan/<slug>/handoff/v<x.y>/handoff.yaml ; la version figée voisine donne stories, exemples et refs
  version: ""
  sha256: ""
  status: ""             # état de gouvernance du document amont, relevé par verify-handoff.mjs :
                         # baseline | approuvé | en_revue | brouillon. Chaque build-handoff l'écrit
                         # depuis le début, et un seul script le lisait (en console.warn, que rien ne
                         # persiste). « Intègre » veut dire « non altéré », pas « approuvé » : un
                         # brouillon intact est intact, et c'est tout. S108 le rappelle jusqu'à la
                         # gouvernance aval.
phase: prepare           # prepare | execute | prove — le champ manquait, et l'étape livrait pourtant
                         # trois fichiers de phase : la doctrine décrivait un parcours que rien ne
                         # situait, et aucune porte ne se comptait. status.mjs les affiche désormais.

phase_log: []            # une porte franchie, une entrée — `phase` dit la phase EN COURS, `phase_log` dit
                         # comment on y est arrivé, et un retour en arrière s'y écrit avec `kind: retour`.
#  - from: prepare       # la phase qui se clôt
#    to: execute         # celle qui s'ouvre
#    date: ""            # AAAA-MM-JJ
#    decided_by: ""      # qui a tranché — déclaré par l'utilisateur, jamais déduit
#    gate: ""            # l'état de la porte au passage, tel que status.mjs l'a dit
#    waived: []          # conditions franchies par dérogation : - { condition: "", reason: "" }
#    kind: porte         # porte (par défaut) | retour

release: REL-1
candidate: ""              # version candidate testée, par exemple 1.2.0-rc1 (un tag) ou un commit
candidate_commit: ""       # commit exact de la version candidate ; vide = résolu depuis le tag « candidate »

thresholds: { mutation: 60, requirements: 100 }   # score de mutation global (%) ; part d'exigences prouvées (%)
                            # Les seuils étaient dans `settings`, et les quatre documents amont les
                            # avaient dans `coverage_thresholds` : deux noms, deux emplacements, la même
                            # chose. Un seul nom désormais ; l'ancien reste lu (S107).
                            # Un seuil à 0 ne compare rien : il passe par une dérogation nommée (S105).

settings:
  critical_journeys: []    # parcours du PRD à couvrir de bout en bout : [PJ-01]
  impl_state: ""           # état d'implémentation pour la réalisation ; vide = impl/<initiative>/state.yaml
  reports:                 # rapports collectés (artefacts de CI de la version candidate)
    unit: reports/unit.xml
    acceptance: reports/acceptance.json
    contract: ""
    integration: ""
    e2e: ""
    mutation: ""
    security: ""           # SAST, DAST, audit des dépendances : rapport JUnit ou équivalent
    accessibility: ""
    browsers: ""           # par exemple les rapports de qa-domain-runner

  ci:                      # provenance des preuves (R9) : rapports issus d'un passage de CI réussi sur le commit candidat
    required: true
    workflow: "Tizi — preuves"   # nom du workflow qui produit les preuves (install.mjs --ci)
    artifact: tizi-preuves       # artefact qui contient les rapports et le manifeste
    events: [push, workflow_dispatch, release, schedule]   # un passage de pull request teste un commit de fusion : exclu
    allow_skipped: []            # jobs dont l'absence est acceptée
    reason: ""                   # obligatoire si required: false

environments: []           # catalogue : chaque mesure de NFR dit sur lequel elle a été prise
#  - { id: ENV-01, name: "", url: "", data: "" }   # `data` : le jeu de données, sans lequel un p95 ne se compare pas

nfr_results: []            # mesures des vérifications de NFR prévues à l'étape tests
#  - { id: NR-01, nfr: NFR-001, measured: "p95 = 1,4 s", target: "p95 < 2 s", pass: true, environment: ENV-01, evidence: reports/perf.html, date: "" }

exploratory: []            # sessions de tests exploratoires (references/exploratory-testing.md)
#  - id: XS-01
#    charter: { explore: "", with: "", discover: "" }   # « explorer X avec Y pour découvrir Z »
#    targets: []           # risques visés : TH-xxx, ZO-xxx, H-xxx, éléments nouveaux
#    timebox_min: 60
#    tester: ""
#    status: prevue        # prevue | faite | abandonnee
#    date: ""
#    notes: ""
#    findings: []          # - { severity: bloquant | majeur | mineur, text: "", story: "" }

waivers: []                # exigences non prouvées, et seuils non atteints, assumés pour cette release
#  - { id: AC-004, reason: "", approved_by: "" }        # une exigence : la clé est `id`
#  - { metric: mutation, reason: "", approved_by: "" }  # un seuil : la clé est `metric`
#  Une dérogation ne compte que si elle dit POURQUOI et QUI l'a approuvée : `{ id: AC-004 }` seul
#  suffisait à retirer un critère de la porte de release (R2). Sans l'un des deux, elle n'éteint rien.

approvals: []              # - { who: "", decision: approuvé | refusé, date: "", reserves: [] } — déclaré par l'utilisateur

session:                   # continuité entre sessions (references/sessions.md)
  next_action: ""          # prochaine action notée avant une pause
