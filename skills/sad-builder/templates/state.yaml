# ─────────────── Design ───────────────
constitution_check:        # vérification de la constitution du produit, avant et après la conception
  before: { date: "", by: "" }
  after: { date: "", by: "" }
  conflicts: []             # - { principle: PC-01, element: ADR-002, resolution: corrigé | dérogation | amendement, note: "" }

decisions: []              # ADR au format MADR v4 (references/adr.md)
#  - id: ADR-001
#    title: ""
#    status: proposé       # proposé | accepté | rejeté | déprécié | remplacé
#    supersedes: ""        # ADR-xxx remplacé par celui-ci
#    context: ""           # problème à résoudre, en 2 à 4 phrases
#    drivers: [AD-01]      # moteurs, contraintes ou règles qui pèsent sur le choix
#    options:              # au moins deux
#      - { name: "", description: "", pros: [], cons: [] }
#    outcome: ""           # nom de l'option retenue
#    justification: ""
#    consequences: { good: [], bad: [] }
#    prevents: ""          # la divergence que la décision empêche : ce que deux parties construites séparément feraient différemment sans elle
#    rule: ""              # la règle vérifiable qui l'empêche, formulée pour un développeur ou un agent (« tout accès aux dossiers passe par… »)
#    confirmation: ""      # comment on vérifiera que la règle est respectée (test d'architecture, vérification de forme, revue)
#    elements: []          # éléments C4 concernés
#    decided_by: ""        # déclaré par l'utilisateur, issu de decision_rights
#    date: ""
#    lint_waivers: []

nfr_responses: []
