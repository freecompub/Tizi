# État de session d'une conception — source de vérité. sad.md, les ADR et les squelettes de contrats sont générés à partir de lui.
document: sad
initiative:
  name: ""
  slug: ""
context_mode: greenfield   # greenfield | brownfield — choisi au démarrage, ne change plus
phase: explore             # explore | design | govern

phase_log: []            # une porte franchie, une entrée — `phase` dit la phase EN COURS, `phase_log` dit
                         # comment on y est arrivé. « Un changement de phase se demande : ce n'est pas la
                         # suite du travail, c'est une porte, et il s'écrit dans l'état avec sa date »
                         # (references/questions.md). Le champ manquait : au deuxième dossier réel l'agent
                         # a écrit le passage en COMMENTAIRE, que rien ne lit et que le document rendu ne
                         # peut pas reprendre. S100 réclame la trace, S101 son décideur et sa date.
#  - from: discover      # la phase qui se clôt
#    to: define          # celle qui s'ouvre
#    date: ""            # AAAA-MM-JJ
#    decided_by: SH-02   # qui a tranché — déclaré par l'utilisateur, jamais déduit
#    source: SRC-080     # la source qui porte la décision
#    gate: ""            # l'état de la porte au passage, RECOPIÉ tel que status.mjs l'a dit :
#                          # « X condition(s) tenue(s) sur Y mesurée(s) ». Le compte se relit : Y moins X
#                          # donne les conditions non tenues, et `waived` doit en nommer exactement
#                          # autant (S124). C'était le seul champ de l'état que rien ne relisait — une
#                          # phrase libre, qu'aucun script ne pouvait contredire
#    waived: []          # conditions franchies par dérogation : - { condition: "", reason: "" }
#    kind: porte         # porte (par défaut) | retour — un retour en arrière est un passage comme un
#                        # autre, et il s'écrit dans le MÊME journal : `define_returns` ne valait que
#                        # pour le BRD, les trois autres documents reculaient sans rien écrire, et les
#                        # phases cycliques du plan ne se lisaient nulle part. Un retour porte en plus
#                        # `zone` (la zone d'ombre qui l'a provoqué) et `reason`. Sur un retour ponctuel,
#                        # `phase` ne change pas : le journal dit l'aller-retour, `phase` dit où on est.
created: ""
updated: ""

# ─────────────── Amont (copie en lecture seule du handoff du PRD) ───────────────
source_prd:
  path: ""                 # prd/<slug>/handoff/v<x.y>/handoff.yaml
  version: ""
  sha256: ""             # empreinte relevée par verify-handoff.mjs à l'ingestion
  status: ""             # état de gouvernance du document amont, relevé par verify-handoff.mjs :
                         # baseline | approuvé | en_revue | brouillon. Chaque build-handoff l'écrit
                         # depuis le début, et un seul script le lisait (en console.warn, que rien ne
                         # persiste). « Intègre » veut dire « non altéré », pas « approuvé » : un
                         # brouillon intact est intact, et c'est tout. S108 le rappelle jusqu'à la
                         # gouvernance aval.
prd_ref:
  problem: ""
  vision: ""
  functional_requirements: []   # - { id: FR-001, statement: "", priority: must, release: REL-1, business_rules: [] }
  nfrs: []                      # - { id: NFR-001, category: "", statement: "", metric: "", target: "", measurement: "", applies_to: [] }
  constraints: []               # - { id: CON-01, statement: "", imposed_by: "" }
  business_rules: []            # - { id: RG-001, statement: "", kind: "", enforcement: "", automation: automatisée }
  personas: []                  # - { id: PER-01, name: "", role: "" }
decision_rights: []        # repris du PRD ; ajoute au moins le domaine `architecture` et `acceptation_risque_securite`
#  - { domain: architecture, decider: "", escalation: "", confirmed_by: "" }

sources: []                # preuves techniques : code, configuration, manifeste, document, mesure, spike, entretien
#  - { id: SRC-001, type: code, ref: "repo@commit:chemin", date: "", note: "", confirms: [] }
#                           # `note` porte ce que la source dit — dû pour un entretien (S102), où c'est le
#                           # verbatim. `confirms` : ce que cette source confirme quand elle EST une
#                           # relecture, et elle rejoint les `sources` de chacun (S103)

