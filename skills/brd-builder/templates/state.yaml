# État de session d'une initiative BRD — mis à jour par l'agent après chaque échange validé.
document: brd
initiative:
  name: ""
  slug: ""
  trigger: ""            # pourquoi maintenant
  derived_from: {}       # d'où elle vient, quand elle ne naît pas d'une demande mais d'une autre
                         # initiative. Renseigne `derived_from` à la création : `split_into` ne dit la
                         # filiation que vers le bas, et seulement depuis une mère close
  #  initiative: ""      # slug de l'initiative d'origine
  #  reason: decoupage   # decoupage | sortie_perimetre | autre:<libellé>
  #  decision: ""        # la décision qui l'a produite, chez la mère : DD-xx, ou sa décision d'opportunité
phase: assess            # assess | discover | define | govern | close (opportunité jetée)

phase_log: []            # une porte franchie, une entrée — `phase` dit la phase EN COURS, `phase_log` dit
                         # comment on y est arrivé. « Un changement de phase se demande : ce n'est pas la
                         # suite du travail, c'est une porte, et il s'écrit dans l'état avec sa date »
                         # (references/questions.md). Le champ manquait : au deuxième dossier réel l'agent
                         # a écrit le passage en COMMENTAIRE, que rien ne lit et que le document rendu ne
                         # peut pas reprendre. S100 réclame la trace, S101 son décideur et sa date.
#  - from: discover      # la phase qui se clôt
#    to: define          # celle qui s'ouvre
#    date: ""            # AAAA-MM-JJ
#    decided_by: SH-02   # qui a tranché — déclaré par l'utilisateur, jamais déduit
#    source: SRC-080     # la source qui porte la décision
#    gate: ""            # l'état de la porte au passage, tel que status.mjs l'a dit : « 7 conditions sur 7 »
#    waived: []          # conditions franchies par dérogation : - { condition: "", reason: "" }
#    kind: porte         # porte (par défaut) | retour — un retour en arrière est un passage comme un
#                        # autre, et il s'écrit dans le MÊME journal : `define_returns` ne valait que
#                        # pour le BRD, les trois autres documents reculaient sans rien écrire, et les
#                        # phases cycliques du plan ne se lisaient nulle part. Un retour porte en plus
#                        # `zone` (la zone d'ombre qui l'a provoqué) et `reason`. Sur un retour ponctuel,
#                        # `phase` ne change pas : le journal dit l'aller-retour, `phase` dit où on est.
created: ""              # AAAA-MM-JJ
updated: ""

opportunity:              # phase Assess (references/phase-assess.md)
  request:
    verbatim: ""           # la demande initiale, mot pour mot
    classification: ""     # figee (une solution précise, qui masque souvent le problème) | fluide (une aspiration vague)
    presumed_solution: ""  # pour une demande figée : la solution présumée, à remonter au problème
  canvas:
    problems: []           # problèmes, ou idées de solution à ramener à un problème
    users: []              # utilisateurs et clients visés
    solutions_today: []
    user_value: ""
    user_metrics: []
    adoption: ""
    business_problem: ""
    business_metrics: []
    budget: ""             # ordre de grandeur : jours, semaines, mois
  decision: en_attente     # en_attente | aller_plus_loin | jeter | decoupee | a_apprendre | reportee
  reason: ""
  to_learn: []             # si a_apprendre : - { question: "", who: "" }
  split_into: []           # si decoupee : slugs des initiatives filles. Sans eux, « close » se relit
                           # comme un abandon — ce qui est arrivé, avec la vérité en commentaire YAML
  decided_by: ""           # déclaré par l'utilisateur
  date: ""

problem:
  statement: ""          # 2-3 phrases, confirmées par l'utilisateur
  confirmed: false
  symptoms: []           # - { text: "", source: SRC-xxx }
  impact: []             # - { type: temps|cout|risque|qualite, text: "", source: SRC-xxx }

success_signals: []      # - { text: "", measurable: false }

scope:
  in: []                 # - { text: "", reason: "" } — ou une phrase, si elle se suffit
  out: []                # - { text: "", reason: "" } — la raison compte : rien ne sort en silence
  deadline: ""

current_process:         # reconstitué en Discover (atelier, entretiens). MÊME FORME que target_process :
  events: []             # le processus actuel et le processus cible se lisent côte à côte
#    - { event: "Dossier reçu", actor: "", source: SRC-xxx }

constraints: []          # - { type: legale|contractuelle|organisationnelle|budgetaire|environnement|autre:<libellé>, text: "", source: SRC-xxx, implication: "" }
                          #   environnement : conditions réelles d'usage (bruit, lumière, mains occupées ou gantées, déplacement, connexion, interruptions, temps disponible)

stakeholders: []
#  - id: SH-01
#    name: ""
#    role: ""
#    impact: fort          # fort | faible | inconnu — à quel point le changement touche son travail
#    power: fort           # fort | faible | inconnu — capacité à peser sur la décision ou l'adoption
#    influence: positive   # positive | négative | neutre | inconnue — sens dans lequel elle pèsera.
#                          # La seule des quatre qui ne se déduit pas : elle se demande, et sur un fort
#                          # pouvoir son absence est une zone d'ombre (S93)
#    quadrant: impliquer   # DÉDUIT de power × impact, jamais affirmé (S92) : fort×fort impliquer,
#                          # fort×faible satisfaire, faible×fort consulter, faible×faible informer.
#                          # Si l'un des deux est `inconnu`, laisse-le VIDE : la gouvernance en tire un
#                          # rôle de revue, et un quadrant supposé fait un approbateur supposé
#    attitude: ""          # ce qu'elle pense du changement, du sponsor, de la démarche (verbatim si possible)
#    decision_domains: []  # domaines de decision_rights sur lesquels elle a autorité
#    end_user: false       # utilisatrice directe du futur processus ou système
#    represents: ""        # si elle parle au nom d'un groupe : lequel (les représentants ne remplacent pas les vrais utilisateurs)
#    represents_source: ""  # LA source où elle le dit elle-même : SRC-xxx, et elle doit y être locutrice
#                          # (S110). Au troisième dossier réel, un représentant des parents s'est trouvé
#                          # enregistré représentant « des membres du bureau », déduit de la dernière
#                          # proposition d'un tour de table où le « je » final revenait à lui. La valeur
#                          # était renseignée, donc conforme : rien ne pouvait la relire. Ce qu'un tiers
#                          # dit d'elle ne la mandate pas
#    represented_by: ""    # l'inverse, sur la personne REPRÉSENTÉE : le SH-xx de qui répond pour elle.
#                          # « Chaque fonction a un représentant » s'enregistre ici — pas dans la prose
#                          # du `represents` d'un autre, qui nomme un groupe qu'aucun script ne peut
#                          # rapprocher d'un identifiant. Et ça ne ferme rien : la zone sur sa voix
#                          # non entendue reste ouverte (S94)
#    joignable_par: ""     # PAR QUOI on peut la joindre : vive voix | courriel | messagerie |
#                          # téléphone | autre:<canal nommé>. Vide si on n'a pas de quoi la joindre —
#                          # ne pas savoir est un fait, pas une faute, et rien ne le réclame.
#                          # L'adresse, le numéro, l'identifiant N'ENTRENT PAS ICI : ce fichier se
#                          # commite, part dans le handoff, et `freeze-version.mjs` en fige une copie
#                          # en lecture seule sous `versions/` d'où rien ne se reprend. Ils vont dans
#                          # `contacts.yaml`, à côté de l'état, que `.gitignore` exclut. S114 refuse
#                          # une coordonnée ici, et signale un canal annoncé qui n'en a aucune là-bas
#    sollicitee_le: ""     # AAAA-MM-JJ — QUAND la question lui est partie, sur le canal ci-dessus.
#                          # Elle ne se lit que sur le statut « sollicitée ». Sans elle, « sollicitée »
#                          # compte comme si personne n'avait jamais écrit (S115) : c'est toi qui écris
#                          # le champ, et une sollicitation invérifiable est une case cochée. Avec elle,
#                          # le silence de la personne devient une question qui VIT — les constats sur
#                          # sa voix non entendue changent de liste au lieu de compter contre le dossier,
#                          # et `review-sources.mjs --etat` dit depuis combien de jours elle est en vol
#    indisponible_motif: ""  # POURQUOI elle n'est pas joignable, sur le statut « non disponible » et
#                          # nulle part ailleurs (S116) : silence | refus | absence | renoncement |
#                          # autre:<libellé>. Le mot seul couvrait quatre situations — elle n'a jamais
#                          # répondu ; elle a REFUSÉ, ce que le message de sollicitation l'invite à
#                          # faire ; elle est absente, en congé, partie ; ou NOUS avons renoncé pour
#                          # nos raisons. La dernière est la seule qui soit de notre faute, et c'est
#                          # celle qu'un mot unique cachait le mieux. Renoncer N'ÉTEINT RIEN : le
#                          # statut reste « non entendue », donc S94 et S83 continuent de dire que sa
#                          # voix manque — un choix de notre part n'est pas une réussite du dossier.
#                          # Et un refus est SA parole : consigne ses mots en source avant de l'écrire
#    sollicitee_zone: ""   # LA zone d'ombre sur laquelle la question est partie : ZO-xxx. Avec
#                          # `sollicitee_le` — les deux ou aucun (S115). Sans elle, au tour suivant,
#                          # rien ne dit si sa réponse portait sur la question posée : le message de
#                          # suite la remerciait d'avoir répondu puis reposait la même question, et
#                          # finissait par demander à la personne de trancher à notre place. Avec
#                          # elle, l'agent sait reprendre la question sans faire porter l'erreur à qui
#                          # a répondu, et une relance repart sur LA question partie, pas sur celle que
#                          # le classement remettrait en tête
#    status: à interroger  # à interroger | sollicitée | interrogée | non disponible. « interrogée »
#                          # veut dire ENTENDUE AU MOINS UNE FOIS, pas « plus rien à lui demander » :
#                          # la zone `partie_prenante_non_entendue` se ferme quand aucune zone ouverte
#                          # ne la nomme en `ask_to`, jamais sur le seul changement de statut.
#                          # « sollicitée » veut dire QU'ON A ÉCRIT, pas qu'on a reçu : elle reste non
#                          # entendue — une décision rendue en son nom reste rapportée par un tiers
#                          # (S90), une source à son nom reste du second degré (S81). Ce qui change,
#                          # c'est le reproche de son silence, pas le fait qu'elle se taise

decision_rights: []      # qui tranche quoi, établi au cadrage et validé par le sponsor
#  - domain: perimetre     # perimetre | objectifs | priorites | donnees_securite | processus:<nom> | regles:<domaine> | autre:<libellé>
#    decider: SH-01
#    escalation: SH-00     # recours si le décideur ne tranche pas ; le sponsor en dernier ressort
#    confirmed_by: SH-00   # qui a confirmé cette attribution
#    source: SRC-xxx

sources: []
#  - id: SRC-001
#    type: entretien       # cadrage | entretien | échange écrit | observation | mesure | test | document | atelier | ticket | revue | dt-handoff | décision | autre:<libellé>
#                          # échange écrit : la personne a répondu PAR ÉCRIT — messagerie, courriel, fil
#                          # d'équipe. C'est un recueil auprès d'elle comme un entretien : sa voix compte
#                          # pour S83 et S95. Mais il n'a pas de salle, donc pas de `present` (S91), et
#                          # il ne se déclare pas `entretien` : celui qui relit six mois plus tard ne
#                          # peut plus distinguer une conversation de quarante minutes d'un fil de six
#                          # messages, et le mot « entretien » perd son sens dans tous les dossiers
#                          # décision : un choix de l'utilisateur, pas un recueil — il ne vaut pas une voix entendue (S83)
#                          # cadrage : l'échange qui ouvre l'initiative, avec qui porte la demande. Déclaratif,
#                          # et souvent rapporté au nom d'un tiers : la partie prenante nommée doit être
#                          # celle qui a parlé, pas celle dont on rapporte les besoins (S81)
#                          # observation, mesure et test donnent une preuve « observée » ; les autres une preuve « rapportée »
#    date: ""
#    stakeholders: [SH-01] # les voix ENTENDUES dans cet échange
#    present: []           # LA SALLE ENTIÈRE : les silencieux ET les locuteurs ci-dessus (S91).
#                          # Renseigne `present` quand le tour de table en a nommé plus d'un : présent
#                          # et locuteur d'aucune source, c'est quelqu'un qui n'a pas été entendu — et
#                          # son silence n'est pas un accord
#    quote: ""             # CE QUI A ÉTÉ DIT, mot pour mot, sans reformulation. Dû pour une source de
#                          # parole — cadrage, entretien, atelier, revue, décision (S102) —, sauf si un
#                          # fichier le porte. Le modèle n'avait aucun champ pour ça : au deuxième dossier
#                          # réel, 92 sources sur 93 dont 65 entretiens ne portaient que leurs métadonnées,
#                          # et ce qui avait été dit ne survivait qu'à la conversation. On ne fait pas
#                          # relire ce qui n'est écrit nulle part : `feedback` et S84 portaient sur du vide
#    understood: ""        # ce que l'agent en a TIRÉ, séparé du verbatim — c'est ce qui se corrige en
#                          # relecture quand la citation est juste et la conclusion fausse. Ne remplace
#                          # jamais `quote` : ce qui se relit, c'est ce qui a été dit
#    confirms: []          # ce que cette source confirme ou corrige, quand elle EST une relecture :
#                          # [BC-003, BR-001]. Et elle rejoint les `sources` de chacun (S103) — sinon la
#                          # confirmation existe sans rattacher, l'élément reste à source unique et jamais
#                          # relu, et le relevé de relecture ne la montre pas
#    path: ""              # fichier dans brd/<slug>/sources/ si fourni
#    corrects: []          # les SOURCES dont cette source corrige la lecture : [SRC-001]. `confirms`
#                          # ci-dessus pointe vers des ÉLÉMENTS — BC, BR, RG — jamais vers une source :
#                          # rien ne menait du tour de table à l'échange qui en a corrigé la lecture, et
#                          # qui lira le premier dans six mois n'avait aucun chemin vers le second
#                          # (S112). Une source corrigée est la première à faire relire
#    feedback: à envoyer   # retour à la source : à envoyer | envoyé | confirmé | corrigé | sans objet
#    feedback_le: ""       # AAAA-MM-JJ — QUAND la demande est partie. `envoyé` et `à envoyer` tombaient
#                          # dans le même sac : S84 ne lisait que « confirmé | corrigé | sans objet », donc
#                          # « demandé le 21, pas encore de réponse » et « jamais rien demandé à personne »
#                          # rendaient le même constat. L'état `envoyé` ne servait à rien. Avec la date, il
#                          # vaut « non mesuré » — une question qui vit, que la porte ne compte pas contre
#                          # vous — et le relevé dit depuis combien de jours. Sans la date, il reste un
#                          # échec : c'est l'agent qui écrit le champ, et « envoyé » qu'on ne peut pas
#                          # vérifier est une case cochée, pas un fait
#    feedback_par: ""      # par quoi elle est partie : oral | courriel | messagerie | <canal nommé>.
#                          # Informatif — rien ne le réclame. Il sert à qui relance, et à qui se demande
#                          # si une trace existe ailleurs que dans ce fichier
#    feedback_motif: ""    # POURQUOI « sans objet », sur une source de parole recueillie — cadrage,
#                          # entretien, échange écrit, atelier, revue (S111). C'est la seule valeur qui
#                          # éteint S84 sans que personne n'ait rien relu : sur une décision de
#                          # l'utilisateur elle va de soi, sur un échange où quelqu'un a parlé elle s'explique

candidate_needs: []
#  - id: BC-001
#    text: "Pouvoir …"
#    sources: [{ ref: SRC-001, location: "l.42" }]
#    concerns: []          # DE QUI c'est le besoin : les SH-xx qui le portent. Dû dès qu'il est confirmé,
#                          # et sur tous en Define. S83 ne voit que l'absence totale d'utilisateur
#                          # direct entendu — un sur quatre, et elle est verte ; ici le grain est le
#                          # besoin, et un besoin formulé pour quelqu'un qu'on n'a pas entendu se dit
#                          # (S95). Sur le dossier réel, l'information vivait dans `notes`, en prose
#    status: proposé       # proposé | confirmé | intégré | abandonné | hors_périmètre
#    reason: ""            # obligatoire si abandonné ou hors_périmètre
#    moved_to: ""          # si hors_périmètre parce qu'une AUTRE initiative le reprend : son slug. Le
#                          # besoin y garde son identifiant. Sans ce champ, « rien ne disparaît en
#                          # silence » tient dans une phrase de `reason` que personne ne relit
#    notes: ""             # solutions évoquées, nuances

hypotheses: []
#  - id: H-001
#    text: ""
#    basis: ""             # sur quoi repose l'hypothèse
#    verification: ""      # COMMENT la trancher, et auprès de qui ou de quoi : une personne à entendre,
#                          # un document à récupérer, un chiffre à relever. Dû tant qu'elle est à
#                          # vérifier (S97) — sans lui, elle attend la session où quelqu'un y repense,
#                          # et le moyen le moins coûteux ne se voit pas
#    status: à vérifier    # à vérifier | confirmée | infirmée

shadow_zones: []
#  - id: ZO-001
#    type: probleme_flou   # probleme_flou | partie_prenante_non_entendue | profil_manquant | succes_non_mesurable
#                          # | contradiction | hypothese_non_verifiee | solution_deguisee | perimetre_flou
#                          # | attendu_implicite | arbitre_inconnu
#    subtype: ""           # contradiction uniquement : factuelle | vocabulaire | reglementaire | interets
#    parties: []           # contradiction : parties prenantes en désaccord
#    arbiter: SH-00        # contradiction « interets » : décideur issu de decision_rights, jamais partie au conflit
#    question: "…?"
#    origin: cadrage       # cadrage | SRC-xxx | atelier | point-etape | council:<lentille>
#    ask_to: SH-01         # SH-xx ou rôle à identifier
#    action: entretien     # entretien | document | atelier | decision | question-utilisateur
#    blocking: false      # true seulement si l'étape suivante ne peut pas COMMENCER : nomme-la,
#                         # et dis ce qui s'y ferait de faux (references/phase-discover.md)
#    status: ouverte       # ouverte | levée | assumée
#    resolution: ""        # levée : réponse + source (SRC-xxx, emplacement) ou décision (DD-xx) ; assumée : raison
#    related: []           # H-xxx, BC-xxx, SRC-xxx liés

council_runs: []
#  - date: ""
#    mode: preparation     # preparation | couverture | completude
#    lenses: [utilisateur-final, operations-support, securite-conformite, sponsor-finance, sceptique]
#    initiatives: []       # les initiatives couvertes par CE passage, si elles sont plusieurs ; vide = celle-ci
#                          # seule. Un passage partagé s'écrit à l'identique dans chacune : sans ce champ,
#                          # « 40 proposées » se lit comme 40 pour ce dossier-là, et une somme sur le
#                          # portefeuille les compte autant de fois qu'il y a d'initiatives. C'est arrivé.
#    proposed: 0           # questions renvoyées par les lentilles pour TOUT le passage, avant fusion des doublons
#    questions:            # celles qui ont survécu à l'arbitrage, écartées comprises : un compteur ne se relit pas.
#                          # Dans CE fichier, seulement celles dont le `target` porte sur cette initiative.
#      - text: ""
#        lenses: []        # lentilles qui l'ont trouvée ; plusieurs = signal de priorité
#        outcome: retenue  # retenue | écartée | réservée (disponible pour un prochain council)
#        reason: ""        # obligatoire si écartée ou réservée
#        zone: ZO-xxx      # si retenue : la zone d'ombre créée

# ─────────────── Phase Define ───────────────

objectives: []
#  - id: OBJ-01
#    statement: ""         # résultat métier attendu
#    indicator: ""
#    baseline: ""          # valeur actuelle ; si inconnue → zone d'ombre succes_non_mesurable
#    target: ""
#    deadline: ""
#    owner: SH-01
#    status: proposé       # proposé | validé | abandonné
#    lint_waivers: []

impact_map: []            # Pourquoi (objectif) → Qui (acteur) → Comment (changement de comportement) → Quoi (exigences)
#  - objective: OBJ-01
#    actor: SH-02          # ou rôle
#    impact: ""            # changement de comportement attendu
#    requirements: [BR-001]

business_requirements: []
#  - id: BR-001
#    statement: "Le service doit pouvoir …"
#    objectives: [OBJ-01]
#    from_needs: [BC-001, BC-004]
#    business_rules: []    # RG-xxx que l'exigence fait respecter ou dont elle dépend
#    acceptance:           # résultats observables côté métier
#      - ""
#    priority: ""          # must | should | could | wont
#    rationale: ""         # pourquoi cette priorité
#    status: proposé       # proposé | validé | abandonné
#    lint_waivers: []      # avertissements acceptés : - { rule: L03, reason: "" }

business_rules: []         # règles métier : ce ne sont pas des exigences, mais des directives que le métier contrôle
#  - id: RG-001
#    statement: "Un dossier ne doit pas être transmis sans justificatif de domicile."
#    kind: comportement    # definition (fait, calcul, inférence : ne peut pas être violée) | comportement (obligation ou interdiction : peut l'être)
#    enforcement: stricte  # comportement uniquement : stricte | derogation_autorisee | derogation_justifiee | indicative
#    sources: [{ ref: SRC-001, location: "l.12" }]   # texte de loi, procédure, ou savoir tacite d'une personne
#    owner: SH-01          # responsable métier qui peut la faire évoluer
#    rationale: ""         # pourquoi elle existe ; à challenger si personne ne le sait
#    exceptions: []        # chaque exception est elle-même une règle : RG-xxx
#    status: proposé       # proposé | validé | abandonné
#    lint_waivers: []

decisions: []              # arbitrages rendus pendant la construction du BRD
#  - id: DD-01
#    question: ""
#    zone: ZO-012          # zone d'ombre à l'origine
#    options:
#      - { text: "", impacts: "" }   # qui serait insatisfait, autre moyen possible, risque pris en écartant
#    decision: ""
#    rationale: ""
#    decided_by: SH-01     # déclaré par l'utilisateur, jamais déduit
#    date: ""
#    status: proposé       # proposé | validé

target_process:
  events: []
#    - { event: "", actor: "", change: nouveau }   # nouveau | modifié | inchangé | supprimé
  org_impacts: []          # rôles, organisation, formation — { text: "", source: SRC-xxx } ou une phrase

risks: []
#  - id: R-01
#    text: ""
#    origin: ZO-003        # zone d'ombre assumée, hypothèse, source, partie prenante
#    related: []           # parties prenantes ou éléments concernés
#    likelihood: ""        # faible | moyenne | forte — dû dès que le risque est consigné (S109) :
#                          # vide ne veut pas dire faible, ça veut dire non apprécié. Un risque sans
#                          # vraisemblance ni ampleur ne se priorise pas, et c'est lui qui porte une
#                          # zone d'ombre assumée : un porteur creux rend la zone au silence
#    impact: ""            # faible | moyen | fort — ce que le risque coûterait s'il se produisait. Rien
#                          # à voir avec l'`impact` d'une partie prenante, qui dit à quel point le
#                          # changement la touche : deux échelles, deux questions
#    response: ""          # piste de traitement côté métier — due dès que le risque est validé (S109),
#                          # sinon ce qu'on accepte reste une inquiétude consignée
#    status: proposé       # proposé | validé

dependencies: []           # - { text: "", owner: "" }

glossary: []               # - { term: "", definition: "", source: SRC-xxx }

brd_sections:              # à rédiger | proposé | validé
  context: à rédiger
  objectives: à rédiger
  stakeholders: à rédiger
  processes: à rédiger
  requirements: à rédiger
  business_rules: à rédiger
  constraints: à rédiger
  assumptions_risks: à rédiger
  decisions: à rédiger
  scope: à rédiger
  glossary: à rédiger

principles_applicable: []   # principes de la constitution du produit (.tizi/constitution.yaml) qui s'appliquent à l'initiative ; [] si aucun

synthesis_check:           # porte de synthèse avant Define (fin de Discover), déclarée avec l'utilisateur
  date: ""
  fidelite: { status: "", note: "" }        # la synthèse reflète les sources, pas des suppositions — ok | faible
  couverture: { status: "", note: "" }      # toutes les parties prenantes concernées sont représentées
  robustesse: { status: "", note: "" }      # chaque besoin retenu repose sur plusieurs sources
  actionnabilite: { status: "", note: "" }  # le problème est assez clair pour guider la suite
  alignement: { status: "", note: "" }      # l'équipe et les parties prenantes s'y reconnaissent
  # une dimension « faible » se corrige, ou s'assume : { status: faible, assumed: true, note: "raison" }

transition_requirements: []  # exigences de transition : ce qu'il faut pour passer de l'existant à la cible (BABOK)
#  - id: TR-01
#    kind: formation       # formation | conduite_du_changement | reprise_de_donnees | coexistence | communication | support | autre:<libellé>
#    text: ""
#    stakeholders: [SH-02] # qui est concerné
#    done_when: ""         # critère d'achèvement observable
#    related: [BR-001]
#    sources: []
#    status: proposé

relance: {}                 # deux horloges, en jours, pour une question partie à quelqu'un et restée
                            # sans réponse : { signaler: 1, agir: 5 } par défaut. DIRE à l'utilisateur
                            # qu'il n'y a pas de réponse ne coûte rien et ne sort pas du dossier — un
                            # jour suffit. RELANCER ou RENONCER sort vers quelqu'un qui n'a rien demandé,
                            # et c'est irréversible : relancer au bout d'un jour, c'est harceler, et une
                            # source brûlée ne se rouvre pas là où un avertissement se corrige. Les
                            # confondre fait l'un au rythme de l'autre. Au-delà de `agir`, l'attente
                            # cesse de protéger le dossier : « non mesuré » n'est plus une réponse
                            # acceptable, et S117 le dit. Une association de parents et un service
                            # hospitalier n'ont pas le même tempo, d'où le réglage.
                            # Et aucune horloge ne tourne : rien ne se déclenche, le seuil QUALIFIE ce
                            # qu'on voit en arrivant sur le dossier. Trois semaines sans y revenir, et
                            # l'alerte arrive à trois semaines

thresholds: {}              # seuils en %, par métrique ; vide = valeurs par défaut (lib/rules.mjs, COVERAGE_DEFAULTS).
                            # Un seuil à 0 ne compare rien : c'est une mise hors périmètre, et elle passe
                            # par une dérogation nommée ci-dessous (S105), sinon la mesure se dit « non
                            # mesurée » au lieu de s'afficher atteinte. Mesuré sur le plan de l'exemple :
                            # « Stories prêtes | 2/5 | 40 % | 0 % | atteint ».
                            # Un seuil venu d'ici est un NOMBRE. Une mesure sans cible — « stories
                            # prêtes » : on n'a jamais besoin que toutes le soient, seulement assez pour
                            # le prochain cycle — est déclarée `indicatif` dans le catalogue, pas ici :
                            # le catalogue dit pourquoi, un projet qui écrit 0 assume, et ça se nomme.
waivers: []                 # - { metric: fr_ac, reason: "", approved_by: "" }   # seuil assumé, et par qui
                            # Une dérogation ne compte que si elle dit POURQUOI et QUI l'a approuvée :
                            # sans l'un des deux, elle n'éteint rien (S106). Un seul nom pour les cinq
                            # documents : `coverage_thresholds`, `coverage_waivers` et
                            # `settings.thresholds` restent lus, et S107 dit de les renommer.

# ─────────────── Phase Govern ───────────────

governance:
  version: "0.1"           # version courante : 0.x brouillons et candidates, 1.0 première baseline
  status: brouillon        # brouillon | en_revue | approuvé | baseline
  reviewers: []
#    - { stakeholder: SH-01, role: approbateur }   # approbateur | relecteur | informé
  review_rounds: []
#    - { id: RV-1, version: "0.3", sent: "", channel: export, deadline: "" }   # channel : export | pr
  comments: []
#    - id: CM-001
#      round: RV-1
#      author: SH-02
#      source: SRC-010     # le retour est enregistré comme source
#      target: BR-004      # identifiant ou nom de section
#      text: ""
#      category: correction   # correction | modification | nouvelle_exigence | contestation | question
#      decision: en_attente   # en_attente | accepté | rejeté | reporté
#      reason: ""             # obligatoire si rejeté ou reporté
#      changes: []            # identifiants modifiés suite au commentaire
  approvals: []
#    - stakeholder: SH-01
#      version: "1.0"
#      date: ""
#      decision: approuvé     # approuvé | approuvé_avec_réserves | refusé
#      reserves: []           # R-xx ou ZO-xxx créés pour suivre les réserves
#      evidence: ""           # référence facultative : mail, signature, compte rendu
#      declared_by: utilisateur
  baselines: []
#    - { version: "1.0", date: "" }
  change_requests: []
#    - id: CR-001
#      date: ""
#      requested_by: SH-01
#      description: ""
#      impact: []             # identifiants touchés
#      decision: en_attente   # en_attente | acceptée | refusée
#      target_version: ""

lint_waivers: []           # dérogations nommées qui ne portent sur AUCUN élément : un constat sur une
#  - { rule: S83, id: stakeholders, reason: "" }   # collection entière, sur un fichier de guide ou de
                           # liste de contrôle. Partout ailleurs, la dérogation se met SUR l'élément
                           # concerné. Les règles de forme (Lxx) comme de structure (Sxx) se dérogent,
                           # et une dérogation sans `reason` ne compte pas : l'avertissement reste

session:                   # continuité entre sessions (references/sessions.md)
  next_action: ""          # prochaine action notée avant une pause
