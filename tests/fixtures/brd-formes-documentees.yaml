# État BRD dont le seul but est de renseigner les collections que `exemple/brd/demo` laisse vides, dans
# la forme que le gabarit documente. Le garde-fou de `chain.test.mjs` refusait déjà `[object Object]`
# dans les documents générés — il n'a rien vu pendant des mois parce qu'aucun état de test ne portait
# `problem.symptoms`, `problem.impact` ni `current_process`. Un contrôle ne vaut que l'état qu'on lui
# donne à lire. Sur le deuxième dossier réel, le BRD figé et parti à cinq relecteurs portait dix
# `[object Object]` et annonçait « Aucun élément » là où l'état tenait sept étapes sourcées.
