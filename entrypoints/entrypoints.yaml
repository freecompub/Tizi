# Source unique des points d'entrée du SDLC. install.mjs en génère :
#   - pour Claude Code : une commande par entrée (.claude/commands/<nom>.md), appelée par /<nom> ;
#   - pour GitHub Copilot : un agent par entrée (.github/agents/<nom>.agent.md), choisi dans la liste des agents.
# Ces points d'entrée sont des coquilles : tout le savoir reste dans les skills. N'y ajoute aucune règle de méthode.
#
# tools : outils accordés à l'agent Copilot. Un agent n'a que ce dont son étape a besoin.
#   Deux vocabulaires cohabitent volontairement, parce que Copilot « ignore tout nom d'outil inconnu » :
#   les alias intégrés de la CLI et de l'agent cloud (execute, read, edit, search, agent, web, todo) et
#   les noms namespacés de VS Code (vscode/askQuestions, execute/runInTerminal…). Chaque surface prend
#   ce qu'elle reconnaît. Sans l'alias `execute`, la CLI et l'agent cloud n'auraient AUCUN moyen de
#   lancer un script — alors que chaque point d'entrée en lance. Ne pas retirer `execute`.
# handoffs : boutons de passage proposés par l'agent Copilot ; la commande Claude les cite en fin de réponse.
#
# Les corps ci-dessous demandent l'outil de questions de l'hôte là où l'étape pose des choix fermés
# (le chemin, le tri d'un défaut, le sort d'une tâche non finie). Ce n'est pas une règle de méthode :
# la méthode reste dans les skills (references/questions.md), et le point d'entrée ne fait que nommer
# l'outil, parce que c'est lui qui connaît la surface — askQuestions existe dans VS Code et pas ailleurs.

entrypoints:
  - name: tizi
    title: "Tizi — point d'entrée"
    description: "Point d'entrée de Tizi : dit où en est chaque initiative (BRD, PRD, conception, plan, implémentation, tests) et propose l'étape suivante. À utiliser pour reprendre un travail ou quand on ne sait pas par où commencer."
    skill: null
    argument_hint: "[initiative]"
    inputs:
      optional: ["l'identifiant d'une initiative, pour ne voir qu'elle"]
    tools: [vscode/askQuestions, read, search, execute, execute/runInTerminal, execute/getTerminalOutput]
    handoffs: [tizi-brd, tizi-prd, tizi-sad, tizi-plan, tizi-sprint-review, tizi-backlog, tizi-impl, tizi-test]
    body: |
      Lance `node {scripts}/next-step.mjs .` (ajoute `--initiative <slug>` si l'utilisateur en a nommé une), puis `node {scripts}/sync-agent-instructions.mjs . --check`, et présente le résultat tel quel. Si les instructions du dépôt sont absentes ou périmées, propose de les synchroniser (même script, sans `--check`) : c'est ce que lisent les agents qui ne passent pas par Tizi. Pour le point d'étape, montre l'avancement de chaque initiative, l'étape suivante et pourquoi, les points à noter (zones d'ombre bloquantes, session sans condensé).
      Propose ensuite **une** étape suivante, avec le point d'entrée à utiliser. Ne commence pas cette étape toi-même : elle a son propre point d'entrée.
      Si `next-step.mjs` signale une sprint review due, propose `tizi-sprint-review` en premier.

      **Application existante, Tizi pas encore adopté** (du code dans le dépôt, mais ni `impl/config.yaml` ni `.tizi/adoption.md`) : propose d'abord `node {scripts}/adopt.mjs .`. Il observe le dépôt sans rien exécuter et propose la configuration des tests et une carte grossière de l'existant, chaque élément avec sa preuve ; fais relire ce qu'il signale comme incertain. C'est aussi le moment d'écrire une première **constitution du produit** (`constitution.mjs`) à partir de ce qui existe déjà : documentation réglementaire, règles de sécurité, habitudes d'équipe — quelques principes, chacun avec son moyen de vérification et son responsable.

      **Nouvelle initiative, ou initiative sans chemin décidé** : avant toute étape, choisis le chemin avec l'utilisateur. Pose les six questions fermées (oui ou non) avec l'outil de questions de l'hôte — `vscode/askQuestions` dans VS Code, l'outil de questions de Claude Code — en deux appels, quatre puis deux, parce qu'un appel n'en porte pas plus. « Oui » et « non » comme réponses proposées, la réponse libre toujours ouverte, et pour chacune ce qui dépend de la réponse. Sans l'outil (mode non interactif, éditeur qui ne l'expose pas), numérote-les dans un seul message, avec une ligne « Autre : … ». Les six, dans cet ordre :
      1. S'agit-il d'une modification évidente et sans risque (coquille, texte, configuration) ?
      2. Le changement touche-t-il une exigence réglementaire ou la sécurité des patients ou des utilisateurs ?
      3. L'intention est-elle floue, ou défendue différemment par plusieurs personnes ?
      4. Le changement crée-t-il ou modifie-t-il une règle métier ?
      5. Touche-t-il un contrat d'interface, une donnée sensible, ou crée-t-il un composant ?
      6. Dépasse-t-il quelques jours de travail ?
      Ne réponds pas à sa place : une réponse incertaine vaut « oui ». **Demande aussi qui décide du chemin**, en réponse libre, et n'accepte pas l'environnement pour réponse : ni le nom Git du dépôt, ni le nom de la session. Sur un chemin ouvert par la question réglementaire, qui décide compte, et un nom déduit se relit plus tard comme un nom déclaré. Puis lance `node {scripts}/choose-path.mjs <initiative> --par "<le nom qu'il a donné>" --evident … --reglementaire … --intention-floue … --regle-metier … --contrat-donnee … --plusieurs-jours …`, présente le chemin et sa raison, et propose la première étape. Le chemin est une décision enregistrée : il ne se rétrécit pas ; il s'élargit avec `--elargir` quand une étape découvre ce qu'il fallait (une règle métier, un contrat).
      Tu ne modifies aucun fichier toi-même : seuls les scripts enregistrent le chemin et synchronisent les instructions.

  - name: tizi-brd
    title: "Tizi — 1. Besoin métier (BRD)"
    description: "Étape 1 du SDLC : évaluer une opportunité puis construire le BRD (découverte, exigences métier, gouvernance), ou reprendre un BRD en cours."
    skill: brd-builder
    argument_hint: "<initiative> [demande initiale] [sources]"
    inputs:
      required: ["le nom d'une nouvelle initiative, ou l'identifiant d'une initiative à reprendre"]
      optional: ["la demande initiale, mot pour mot (pour la classer figée ou fluide)", "les sources déjà disponibles : notes, transcriptions, documents", "le résumé de passage d'une démarche de design thinking (hve-core)", "le sponsor ou décideur", "le contexte réglementaire"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput, agent]
    handoffs: [tizi-prd]

  - name: tizi-prd
    title: "Tizi — 2. Produit (PRD)"
    description: "Étape 2 du SDLC : construire le PRD à partir du handoff du BRD (ou en mode autonome), avec story map, tests de valeur et d'usage, exigences et critères."
    skill: prd-builder
    argument_hint: "<initiative> [handoff du BRD]"
    inputs:
      required: ["l'initiative, ou le chemin du handoff du BRD"]
      optional: ["pour un PRD autonome : le problème et les utilisateurs visés", "les résultats de tests déjà menés"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput, agent]
    handoffs: [tizi-sad]

  - name: tizi-sad
    title: "Tizi — 3. Conception"
    description: "Étape 3 du SDLC : concevoir l'architecture à partir du handoff du PRD (moteurs, domaine, C4, ADR, NFR, contrats, menaces), y compris sur un existant."
    skill: sad-builder
    argument_hint: "<initiative> [handoff du PRD]"
    inputs:
      required: ["l'initiative, ou le chemin du handoff du PRD"]
      optional: ["le dépôt de code existant à analyser (brownfield)", "les décisions d'architecture déjà prises"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput, agent]
    handoffs: [tizi-plan]

  - name: tizi-plan
    title: "Tizi — 4. Planification"
    description: "Étape 4 du SDLC : découper en stories et tâches, example mapping, sprint ou flux, revue de fin d'itération, préparation (sans écriture) de l'export vers GitHub ou Jira."
    skill: plan-builder
    argument_hint: "<initiative> [itération]"
    inputs:
      required: ["l'initiative"]
      optional: ["la cadence (sprint ou flux) et la capacité", "l'itération à revoir"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput, agent]
    handoffs: [tizi-backlog, tizi-impl]

  - name: tizi-sprint-review
    title: "Tizi — Sprint review et rétrospective"
    description: "Fin d'itération : sprint review (ce qui a été réalisé et prouvé, adaptation du backlog, prévision) puis rétrospective (coûts, blocages, actions et leur suivi), à partir des mesures réelles."
    skill: plan-builder
    argument_hint: "<initiative> [IT-n]"
    inputs:
      required: ["l'initiative, si le dépôt en compte plusieurs"]
      optional: ["l'itération (sinon celle dont la sprint review est due)"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput]
    handoffs: [tizi-plan]
    body: |
      Suis la phase Review du skill (`references/phase-review.md`).
      1. Lance `node {scripts}/due-reviews.mjs .` pour trouver l'itération concernée, puis `node {scripts}/close-sprint.mjs plan/<initiative>/state.yaml --iteration <IT-n>` : il prépare les mesures, les fiches, les preuves et le document `review/<IT-n>/sprint-review.md`.
      2. **Sprint review**, avec les parties prenantes : ce qui a été réalisé et prouvé, puis l'adaptation du backlog. Fais décider, pour chaque tâche non finie, continuer, découper ou reporter (`review.carryover`), et les tailles à revoir : trois réponses proposées avec leur conséquence, par l'outil de questions de l'hôte (`vscode/askQuestions` dans VS Code, l'outil de questions de Claude Code), la réponse libre toujours ouverte, et un appel par lot de tâches plutôt qu'une liste tronquée.
      3. **Rétrospective**, entre membres de l'équipe : coûts du sprint, causes de blocage récurrentes (une action et un responsable chacune, `review.blockage_actions`), suivi des actions du sprint précédent (`review.actions_followup`), puis une ou deux actions à essayer (`review.team.process.try`).
      Les notes et les décisions viennent de l'équipe : enregistre-les seulement quand elles sont déclarées, puis lance `lint.mjs` pour vérifier qu'aucune décision ne manque (S76, S77).

  - name: tizi-bug
    title: "Tizi — Signaler un problème"
    description: "Pour les testeurs : signaler un problème, retrouver ce qui était convenu dans la spécification, et le trier — défaut rattaché à l'exigence qu'il contredit, demande de changement, question, doublon ou non reproductible."
    skill: test-builder
    argument_hint: "<initiative> [ce que vous observez]"
    inputs:
      required: ["l'initiative, si le dépôt en compte plusieurs", "ce que vous observez"]
      optional: ["la version testée, l'environnement, les données, les étapes", "l'activité, le parcours ou la story concernés", "la référence d'un bug déjà saisi dans GitHub ou Jira"]
    tools: [vscode/askQuestions, read, search, execute, execute/runInTerminal, execute/getTerminalOutput]
    handoffs: [tizi-plan, tizi-test]
    body: |
      Suis `references/defects.md` du skill.
      1. Recueille la fiche : version candidate, environnement, données, étapes, observé. Puis `node {scripts}/defect.mjs <initiative> --signaler …`. Un bug déjà saisi dans GitHub ou Jira se reprend par `import-defects.mjs` plutôt que d'être ressaisi.
      2. Lance `node {scripts}/find-expectations.mjs <initiative> "<observation>"` et montre les attentes proches, avec leur texte exact et l'état de leur preuve. Si rien n'en ressort, propose de parcourir par activité, parcours ou story.
      3. Pose les trois questions du tri, dans l'ordre, avec l'outil de questions de l'hôte (`vscode/askQuestions` dans VS Code, l'outil de questions de Claude Code) : une attente écrite couvre-t-elle la situation ? le comportement la contredit-il ? l'attente paraît-elle fausse ? Puis le classement (défaut, changement, question, doublon, non reproductible) et la sévérité, réponses proposées avec leur conséquence et la réponse libre toujours ouverte. Vérifie les doublons (`--ouverts`). Le testeur tranche ; une demande de changement va au décideur désigné.
      4. Enregistre le tri avec `defect.mjs --trier`. Pour un défaut, propose la story corrective en voie rapide (`tizi-plan`), rattachée à l'épopée de l'exigence.
      Tu ne modifies aucun fichier toi-même : seuls les scripts écrivent au registre.

  - name: tizi-backlog
    title: "Tizi — 4 bis. Application du backlog"
    description: "Applique dans GitHub ou Jira un plan d'opérations déjà approuvé par son empreinte. Seul point d'entrée qui écrit dans le gestionnaire de tickets."
    skill: backlog-executor
    argument_hint: "<initiative> <github|jira>"
    inputs:
      required: ["l'initiative et la cible (github ou jira)"]
      optional: ["le niveau d'autonomie (complet, partiel, manuel)"]
    tools: [read, execute, execute/runInTerminal, execute/getTerminalOutput]
    handoffs: [tizi-impl]

  - name: tizi-impl
    title: "Tizi — 5. Implémentation"
    description: "Étape 5 du SDLC : implémenter une tâche prête du plan — compréhension validée, BDD puis TDD sous garde-fou, revue de code par agents, PR."
    skill: impl-builder
    argument_hint: "<initiative> [TK-xxx]"
    inputs:
      required: ["l'initiative"]
      optional: ["la tâche à prendre (sinon la première prête)"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput, agent]
    handoffs: [tizi-test]

  - name: tizi-test
    title: "Tizi — 6. Vérification de release"
    description: "Étape 6 du SDLC : vérifier une release — parcours critiques, tests exploratoires, NFR, matrice de couverture des exigences, porte de release, preuves."
    skill: test-builder
    argument_hint: "<initiative> <version candidate>"
    inputs:
      required: ["l'initiative et la version candidate"]
      optional: ["l'emplacement des rapports de CI"]
    tools: [vscode/askQuestions, read, search, edit, execute, execute/runInTerminal, execute/getTerminalOutput]
    handoffs: [tizi-plan]
